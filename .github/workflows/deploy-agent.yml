name: Deploy Agent Mateo Estudio

on:
  push:
    branches:
      - main
    paths:
      - 'agent-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar código y reconstruir agente en el VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/mateo-estudio-web
            git pull origin main
            cd agent-service
            docker build -t mateo-estudio-agent .
            docker stop mateo-estudio-agent || true
            docker rm mateo-estudio-agent || true
            docker run -d --name mateo-estudio-agent --restart unless-stopped --env-file .env mateo-estudio-agent
